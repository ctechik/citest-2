name: CI PowerShell Variant 2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Lint with PSScriptAnalyzer
      shell: pwsh
      run: |
        Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
        Invoke-ScriptAnalyzer -Path ./ci_project_2/convert.ps1 -Severity Error, Warning

    - name: Run Pester Tests
      shell: pwsh
      run: |
        Install-Module -Name Pester -Force -Scope CurrentUser
        Invoke-Pester -Path ./ci_project_2/convert.Tests.ps1 -Output Detailed
