name: CI Python Level 4

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # 1. Триггер по расписанию (каждую ночь в 2:00)
  schedule:
    - cron: '0 2 * * *'

jobs:
  # 2. Джоба для проверки стиля кода (Линтер)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install flake8
        run: pip install flake8
      - name: Lint with flake8
        run: flake8 main.py test_main.py --max-line-length=120

  # 3. Джоба для тестов, покрытия и артефактов
  test:
    needs: lint # Запускается только если линтер прошел успешно
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=xml

      # 4. Сохранение отчета о покрытии как артефакта
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      # 5. Сборка артефакта (архив со скриптом)
      - name: Create Artifact
        run: |
          mkdir artifact
          cp main.py artifact/
          tar -czvf my-script.tar.gz -C artifact .

      - name: Upload script artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-script-archive
          path: my-script.tar.gz
