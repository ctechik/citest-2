name: CI PowerShell Variant 2 (Level 4)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *' 

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path ./ci_project_2/convert.ps1 -Severity Error, Warning

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Pester Tests
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser
          Invoke-Pester -Path ./ci_project_2/convert.Tests.ps1 -Output Detailed

      - name: Create Artifact (Archive)
        run: |
          mkdir artifact
          cp ci_project_2/convert.ps1 artifact/
          tar -czvf my-script.tar.gz -C artifact .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-script-archive
          path: my-script.tar.gz
